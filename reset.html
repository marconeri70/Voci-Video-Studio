<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Voci Video Studio V3.2</title><body style="font-family:system-ui;background:#0f1115;color:#fff;padding:30px"><h1>Aggiornamento V3.2</h1><p id="s">Pulizia cache…</p><script>(async()=>{try{if('serviceWorker'in navigator){for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister()}if('caches'in window){for(const k of await caches.keys())await caches.delete(k)}document.getElementById('s').textContent='Cache pulita. Apro Voci Video Studio V3.2…';setTimeout(()=>location.href='./?v=3.1',900)}catch(e){document.getElementById('s').textContent='Apri manualmente index.html: '+e.message}})()</script></body></html>
