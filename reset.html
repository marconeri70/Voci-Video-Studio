<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Voci Video Studio</title><style>body{font-family:system-ui;background:#0f1115;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0}.box{max-width:560px;padding:28px;border:1px solid #333;border-radius:18px;background:#171a21}h1{margin-top:0}p{color:#cfd4df}</style></head><body><div class="box"><h1>Aggiornamento Voci Video Studio</h1><p id="m">Pulizia della vecchia versione in corso…</p></div><script>(async()=>{try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()));}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)));}document.getElementById('m').textContent='Cache pulita. Apertura della V2.2…';setTimeout(()=>location.replace('./index.html?v=2.2-'+Date.now()),700);}catch(e){document.getElementById('m').textContent='Pulizia completata parzialmente. Ricarica la pagina con Ctrl+F5.';}})();</script></body></html>
